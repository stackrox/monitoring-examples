apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-stackrox-prometheus-declarative-configuration
data:
  prometheus.yaml: |
    ---
    name: Prometheus Server
    description: Read-only access to Central metrics for Prometheus
    resources:
    - resource: Administration
      access: READ_ACCESS
    ---
    name: Prometheus Server
    description: Sample role for Prometheus server access
    accessScope: Unrestricted
    permissionSet: Prometheus Server
