apiVersion: monitoring.rhobs/v1alpha1
kind: MonitoringStack
metadata:
  # COO derives the Prometheus service-account name from this name. RHACS M2M
  # maps the resulting "system:serviceaccount:<namespace>:<name>-prometheus".
  name: sample-rhacs
  finalizers:
    - monitoring.observability.openshift.io/finalizer
  labels:
    app: monitoring
spec:
  alertmanagerConfig:
    disabled: false
  prometheusConfig:
    replicas: 1
  resourceSelector:
    matchLabels:
      app: central
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  retention: 45d
